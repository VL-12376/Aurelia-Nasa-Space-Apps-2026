name: Redeploy server

# Render's own auto-deploy is not always triggered by a push. This calls the service's deploy hook so the
# multiplayer server and leaderboard are rebuilt whenever the game's code changes.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Render to deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set, so nothing was triggered. See the README (Publishing)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Deploy requested."
